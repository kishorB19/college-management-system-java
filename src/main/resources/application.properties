# College Management System

spring.application.name=college-management-system

# ============================================================
# Active Profile (switch to 'mysql' for production)
# ============================================================
spring.profiles.active=dev

# ============================================================
# Server Configuration (Render automatically sets PORT)
# ============================================================
server.port=${PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}

# ============================================================
# Database Configuration
# Defaults to H2 in-memory, seamlessly connects to PostgreSQL or MySQL if environment variables are set
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:mem:collegedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.check-template-location=false

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=MyUltraSecureJWTSecretKeyForCollegeManagementSystem2024ThatIsLongEnoughForHS512
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ============================================================
# Pagination Defaults
# ============================================================
app.pagination.default-page-size=10
app.pagination.max-page-size=50

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
