# College Management System

spring.application.name=college-management-system

# ============================================================
# Active Profile (switch to 'postgres' for local PostgreSQL)
# ============================================================
spring.profiles.active=postgres

# ============================================================
# Server Configuration
# ============================================================
server.port=${PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:}

# ============================================================
# Database Configuration
# PostgreSQL Database with credentials
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/collegedb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Kishor1912#}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.thymeleaf.check-template-location=false

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=MyUltraSecureJWTSecretKeyForCollegeManagementSystem2024ThatIsLongEnoughForHS512
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ============================================================
# Pagination Defaults
# ============================================================
app.pagination.default-page-size=10
app.pagination.max-page-size=50

# ============================================================
# File Upload
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
